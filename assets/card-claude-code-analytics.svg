<svg xmlns="http://www.w3.org/2000/svg" width="412" height="150" viewBox="0 0 412 150" role="img" aria-label="claude-code-analytics: Turns raw Claude Code telemetry from a whole engineering org into a live dashboard and a typed REST API.">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#c9d1d9}
.t{font-size:15px;font-weight:700;fill:#1793d1}.b{font-size:12px}.g{font-size:11px;fill:#8b949e}.pr{font-size:12px;fill:#8b949e}
.bar{transform-origin:0 0;animation:grow 1.2s ease-out forwards;transform:scaleY(0)}
@keyframes grow{to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none;transform:none}}
</style>
<rect x=".5" y=".5" width="411" height="149" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect class="bar" x="1" y="14" width="3" height="122" rx="1.5" fill="#1793d1"/>
<text x="22" y="32" class="pr">$ cd ~/projects/<tspan class="t">claude-code-analytics</tspan></text>
<text x="22" y="60" class="b">Turns raw Claude Code telemetry from a whole</text>
<text x="22" y="78" class="b">engineering org into a live dashboard and a typed</text>
<text x="22" y="96" class="b">REST API.</text>
<rect x="22" y="116" width="57" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="51" y="130" text-anchor="middle" class="g">Python</text>
<rect x="87.4" y="116" width="78" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="126" y="130" text-anchor="middle" class="g">Streamlit</text>
<rect x="173.5" y="116" width="57" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="202" y="130" text-anchor="middle" class="g">SQLite</text>
<rect x="238.9" y="116" width="57" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="268" y="130" text-anchor="middle" class="g">Docker</text>
</svg>