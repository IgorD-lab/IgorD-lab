<svg xmlns="http://www.w3.org/2000/svg" width="412" height="150" viewBox="0 0 412 150" role="img" aria-label="DevFolio: Community platform where developers publish projects, collect votes and comments, and find each other.">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#c9d1d9}
.t{font-size:15px;font-weight:700;fill:#1793d1}.b{font-size:12px}.g{font-size:11px;fill:#8b949e}.pr{font-size:12px;fill:#8b949e}
.bar{transform-origin:0 0;animation:grow 1.2s ease-out forwards;transform:scaleY(0)}
@keyframes grow{to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none;transform:none}}
</style>
<rect x=".5" y=".5" width="411" height="149" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect class="bar" x="1" y="14" width="3" height="122" rx="1.5" fill="#1793d1"/>
<text x="22" y="32" class="pr">$ cd ~/projects/<tspan class="t">DevFolio</tspan></text>
<text x="22" y="60" class="b">Community platform where developers publish</text>
<text x="22" y="78" class="b">projects, collect votes and comments, and find</text>
<text x="22" y="96" class="b">each other.</text>
<rect x="22" y="116" width="57" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="51" y="130" text-anchor="middle" class="g">Django</text>
<rect x="87.4" y="116" width="37" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="106" y="130" text-anchor="middle" class="g">DRF</text>
<rect x="132.10000000000002" y="116" width="85" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="175" y="130" text-anchor="middle" class="g">PostgreSQL</text>
</svg>