<svg xmlns="http://www.w3.org/2000/svg" width="412" height="150" viewBox="0 0 412 150" role="img" aria-label="H1R3: Scrapes job boards, then a local LLM scores every posting against your CV and suggests missing keywords.">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#c9d1d9}
.t{font-size:15px;font-weight:700;fill:#f778ba}.b{font-size:12px}.g{font-size:11px;fill:#8b949e}.pr{font-size:12px;fill:#8b949e}
.bar{transform-origin:0 0;animation:grow 1.2s ease-out forwards;transform:scaleY(0)}
@keyframes grow{to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none;transform:none}}
</style>
<rect x=".5" y=".5" width="411" height="149" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect class="bar" x="1" y="14" width="3" height="122" rx="1.5" fill="#f778ba"/>
<text x="22" y="32" class="pr">$ cd ~/projects/<tspan class="t">H1R3</tspan></text>
<text x="22" y="60" class="b">Scrapes job boards, then a local LLM scores every</text>
<text x="22" y="78" class="b">posting against your CV and suggests missing</text>
<text x="22" y="96" class="b">keywords.</text>
<rect x="22" y="116" width="57" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="51" y="130" text-anchor="middle" class="g">Python</text>
<rect x="87.4" y="116" width="57" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="116" y="130" text-anchor="middle" class="g">Ollama</text>
<rect x="152.8" y="116" width="64" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="185" y="130" text-anchor="middle" class="g">Llama 3</text>
</svg>