<svg xmlns="http://www.w3.org/2000/svg" width="412" height="150" viewBox="0 0 412 150" role="img" aria-label="Pharmacy: Prototype that checks prescriptions for drug interactions, stock and safety warnings before a pharmacist approves.">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#c9d1d9}
.t{font-size:15px;font-weight:700;fill:#3fb950}.b{font-size:12px}.g{font-size:11px;fill:#8b949e}.pr{font-size:12px;fill:#8b949e}
.bar{transform-origin:0 0;animation:grow 1.2s ease-out forwards;transform:scaleY(0)}
@keyframes grow{to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none;transform:none}}
</style>
<rect x=".5" y=".5" width="411" height="149" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect class="bar" x="1" y="14" width="3" height="122" rx="1.5" fill="#3fb950"/>
<text x="22" y="32" class="pr">$ cd ~/projects/<tspan class="t">Pharmacy</tspan></text>
<text x="22" y="60" class="b">Prototype that checks prescriptions for drug</text>
<text x="22" y="78" class="b">interactions, stock and safety warnings before a</text>
<text x="22" y="96" class="b">pharmacist approves.</text>
<rect x="22" y="116" width="57" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="51" y="130" text-anchor="middle" class="g">Python</text>
<rect x="87.4" y="116" width="50" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="113" y="130" text-anchor="middle" class="g">Flask</text>
<rect x="145.9" y="116" width="85" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="188" y="130" text-anchor="middle" class="g">JavaScript</text>
</svg>